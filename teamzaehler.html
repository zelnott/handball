<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Team-Punkte · Luchse E1</title>
<style>
  :root{
    --ink:#141019; --bg:#F6F3F8; --card:#ffffff;
    --tg:#E08A00; --to:#EC008C; --vo:#0E9BB8; --ab:#1FA84C;
    --line:#E7E2EC; --muted:#8a8494;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; overflow-x:hidden;}
  .top{display:flex;align-items:center;gap:14px;padding:16px 18px 10px;}
  .logo{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#fff;
    box-shadow:0 0 0 3px var(--to);flex:0 0 auto;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .title{font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.01em;line-height:1;}
  .title em{color:var(--to);font-style:normal;}
  .sub{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .reset{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted);
    border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px 10px;}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}

  .card{--c:var(--to); background:var(--card); border:2.5px solid var(--c);
    border-radius:18px; padding:14px 16px 16px; position:relative; overflow:hidden;}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cname{font-weight:900;font-size:19px;text-transform:uppercase;color:var(--c);letter-spacing:.01em;}
  .ctotal{font-weight:900;font-size:15px;color:var(--ink);}
  .ctotal span{color:var(--muted);font-weight:700;font-size:12px;}

  .bar{height:20px;border-radius:999px;background:#F0EDF3;border:1.5px solid var(--line);
    overflow:hidden;position:relative;margin-bottom:12px;}
  .fill{height:100%;width:0%;background:var(--c);border-radius:999px 0 0 999px;
    transition:width .12s linear;}
  .marks{position:absolute;inset:0;display:flex;}
  .marks span{flex:1;border-right:1px solid rgba(255,255,255,.55);}
  .marks span:last-child{border-right:none;}

  .ctrl{display:flex;align-items:center;justify-content:center;gap:14px;}
  .btn{width:56px;height:56px;border-radius:16px;border:none;font-size:30px;font-weight:900;
    color:#fff;background:var(--c);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,.18); transform:translateY(0);}
  .btn:active{transform:translateY(4px);box-shadow:none;}
  .btn.minus{background:#fff;color:var(--c);border:2.5px solid var(--c);box-shadow:0 4px 0 var(--line);}
  .pending{min-width:64px;text-align:center;}
  .pval{font-weight:900;font-size:30px;line-height:1;color:var(--c);}
  .plabel{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px;}

  .pop{position:absolute;font-weight:900;font-size:22px;color:var(--c);
    pointer-events:none; animation:popfly .7s ease-out forwards;}
  @keyframes popfly{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-46px) scale(1.3);} }

  .foot{padding:8px 14px 26px;}
  .buchen{width:100%;padding:20px;border:none;border-radius:20px;background:var(--ink);color:#fff;
    font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.03em;
    box-shadow:0 6px 0 #000; display:flex;align-items:center;justify-content:center;gap:10px;}
  .buchen:active{transform:translateY(6px);box-shadow:none;}
  .buchen .n{background:var(--to);border-radius:999px;padding:3px 12px;font-size:16px;}
  .hint{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:8px;}

  .milestone{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(20,16,25,.72); z-index:50;}
  .milestone.show{display:flex;}
  .mbox{background:#fff;border-radius:24px;padding:34px 30px;text-align:center;max-width:320px;
    animation:mbpop .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes mbpop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .mbox .mc{font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .mbox .mv{font-weight:900;font-size:58px;line-height:1;margin:6px 0;}
  .mbox .ml{font-weight:800;font-size:16px;color:var(--ink);}
  .mbox button{margin-top:18px;border:none;background:var(--ink);color:#fff;font-weight:800;
    padding:12px 26px;border-radius:999px;font-size:14px;text-transform:uppercase;}

  .confetti{position:fixed;top:0;left:0;width:10px;height:10px;border-radius:2px;
    pointer-events:none;z-index:60;}

  .full{position:absolute;top:8px;right:12px;font-size:10px;font-weight:900;color:#fff;
    background:var(--c);padding:3px 9px;border-radius:999px;letter-spacing:.04em;display:none;}
  .full.show{display:block;}
</style>
</head>

  <div>
    <div class="title">Team-<em>Punkte</em></div>
    <div class="sub">Luchse Düsseldorf E1</div>
  </div>
  <button class="reset" onclick="fullReset()">Zurücksetzen</button>
</div>

<div class="grid" id="grid"></div>

<div class="foot">
  <button class="buchen" onclick="buchen()">
    Punkte einbuchen <span class="n" id="pendingSum">0</span>
  </button>
  <div class="hint">Während der Übung: oben tippen. Danach gemeinsam mit den Kids einbuchen!</div>
</div>

<div class="milestone" id="milestone">
  <div class="mbox">
    <div class="mc" id="mCat">TORE</div>
    <div class="mv" id="mVal" style="color:var(--to)">30</div>
    <div class="ml">🐾 Zeit für einen Luchs-Sticker!</div>
    <button onclick="closeMilestone()">Weiter geht's</button>
  </div>
</div>

<script>
const CATS = [
  {key:'teamgeist', name:'Teamgeist', c:'var(--tg)', hex:'#E08A00'},
  {key:'tore', name:'Tore', c:'var(--to)', hex:'#EC008C'},
  {key:'vorlagen', name:'Vorlagen', c:'var(--vo)', hex:'#0E9BB8'},
  {key:'abwehr', name:'Abwehr', c:'var(--ab)', hex:'#1FA84C'},
];
const STORE_KEY = 'luchse-teampunkte-v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const s = {};
  CATS.forEach(c => s[c.key] = {total:0, pending:0});
  return s;
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState();

const grid = document.getElementById('grid');
CATS.forEach(cat=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--c', cat.hex);
  card.innerHTML = `
    <div class="full" id="full-${cat.key}">ZIEL ERREICHT</div>
    <div class="chead">
      <div class="cname">${cat.name}</div>
      <div class="ctotal"><span id="totlabel-${cat.key}">0</span><span> / 100</span></div>
    </div>
    <div class="bar"><div class="marks">${'<span></span>'.repeat(10)}</div><div class="fill" id="fill-${cat.key}"></div></div>
    <div class="ctrl">
      <button class="btn minus" onclick="adjust('${cat.key}', -1, event)">−</button>
      <div class="pending">
        <div class="pval" id="pending-${cat.key}">0</div>
        <div class="plabel">diese Übung</div>
      </div>
      <button class="btn" onclick="adjust('${cat.key}', 1, event)">+</button>
    </div>
  `;
  grid.appendChild(card);
});

function render(){
  let sum = 0;
  CATS.forEach(cat=>{
    const s = state[cat.key];
    document.getElementById('pending-'+cat.key).textContent = (s.pending>0?'+':'') + s.pending;
    document.getElementById('totlabel-'+cat.key).textContent = s.total;
    document.getElementById('fill-'+cat.key).style.width = Math.min(100,s.total) + '%';
    document.getElementById('full-'+cat.key).classList.toggle('show', s.total>=100);
    sum += s.pending;
  });
  document.getElementById('pendingSum').textContent = (sum>=0?'+':'') + sum;
}

function adjust(key, delta, evt){
  state[key].pending += delta;
  saveState();
  render();
  // little pop feedback
  const btn = evt.currentTarget;
  const rect = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.textContent = (delta>0?'+1':'-1');
  pop.style.left = (rect.left + rect.width/2 - 10) + 'px';
  pop.style.top = (rect.top - 6) + 'px';
  pop.style.color = delta>0 ? getComputedStyle(btn).backgroundColor : '#c33';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(), 700);
}

let milestoneQueue = [];

function buchen(){
  let anyChange = false;
  CATS.forEach(cat=>{
    const s = state[cat.key];
    if(s.pending === 0) return;
    anyChange = true;
    const from = s.total;
    let to = from + s.pending;
    if(to < 0) to = 0;
    s.pending = 0;
    animateCount(cat, from, to);
  });
  if(!anyChange){ saveState(); render(); }
}

function animateCount(cat, from, to){
  const dur = 900;
  const start = performance.now();
  const fillEl = document.getElementById('fill-'+cat.key);
  const totEl = document.getElementById('totlabel-'+cat.key);
  const crossed = [];
  for(let m = Math.floor(from/10)*10 + 10; m <= to; m += 10){
    if(m > from) crossed.push(m);
  }
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-t, 3);
    const val = Math.round(from + (to-from)*eased);
    totEl.textContent = val;
    fillEl.style.width = Math.min(100, val) + '%';
    if(t < 1){
      requestAnimationFrame(step);
    } else {
      state[cat.key].total = to;
      saveState();
      document.getElementById('full-'+cat.key).classList.toggle('show', to>=100);
      crossed.forEach(m => milestoneQueue.push({cat, m}));
      processMilestones();
      render();
    }
  }
  requestAnimationFrame(step);
}

let showingMilestone = false;
function processMilestones(){
  if(showingMilestone || milestoneQueue.length===0) return;
  showingMilestone = true;
  const {cat, m} = milestoneQueue.shift();
  document.getElementById('mCat').textContent = cat.name.toUpperCase();
  document.getElementById('mCat').style.color = cat.hex;
  const mv = document.getElementById('mVal');
  mv.textContent = m;
  mv.style.color = cat.hex;
  document.getElementById('milestone').classList.add('show');
  burstConfetti(cat.hex);
}
function closeMilestone(){
  document.getElementById('milestone').classList.remove('show');
  showingMilestone = false;
  setTimeout(processMilestones, 150);
}

function burstConfetti(hex){
  const colors = [hex, '#EC008C', '#141019', '#ffffff'];
  for(let i=0;i<38;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = 6 + Math.random()*7;
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = (window.innerWidth/2) + 'px';
    el.style.top = (window.innerHeight/2) + 'px';
    el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    const ang = Math.random()*Math.PI*2;
    const dist = 120 + Math.random()*220;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 80;
    const rot = (Math.random()*720-360);
    el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px,${dy+260}px) rotate(${rot}deg)`, opacity:0}
    ], {duration: 1100+Math.random()*500, easing:'cubic-bezier(.2,.7,.4,1)'});
    setTimeout(()=>el.remove(), 1700);
  }
}

function fullReset(){
  if(!confirm('Wirklich ALLE Punkte für das ganze Wochenende zurücksetzen?')) return;
  CATS.forEach(c => state[c.key] = {total:0, pending:0});
  saveState();
  render();
}

render();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
